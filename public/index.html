<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baccarat Live Auto Demo - Admin System</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-bg: #0b2516;
            --table-green: #14532d;
            --table-border: #b45309;
            --gold: #f59e0b;
            --player-blue: #2563eb;
            --banker-red: #dc2626;
            --tie-green: #16a34a;
            --admin-purple: #7c3aed;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Prompt', sans-serif; }
        body { background-color: var(--primary-bg); color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; overflow-x: hidden; }
        .status-bar { width: 100%; background: rgba(0,0,0,0.6); padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--gold); position: relative; z-index: 10; }
        .left-menu-btn { font-size: 1.5rem; color: var(--gold); cursor: pointer; padding: 5px 10px; border-radius: 5px; transition: background 0.2s; }
        .left-menu-btn:hover { background: rgba(255,255,255,0.1); }
        .user-info-group { display: flex; align-items: center; gap: 15px; }
        .timer-box { font-size: 1.3rem; font-weight: 600; color: var(--gold); background: rgba(0,0,0,0.4); padding: 5px 15px; border-radius: 20px; border: 1px solid var(--gold); min-width: 80px; text-align: center; }
        .balance-box { font-size: 1.1rem; font-weight: 600; color: #fff; }
        .balance-box span { color: var(--gold); }
        .user-badge { background: #374151; padding: 4px 12px; border-radius: 15px; font-size: 0.85rem; }
        .user-badge.admin { background: var(--admin-purple); color: #fff; font-weight: bold; }
        
        /* ... (CSS ของเดิม) ... */
        .card-back {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(45deg, #b91c1c, #b91c1c 10px, #7f1d1d 10px, #7f1d1d 20px);
            border-radius: 8px; z-index: 10; border: 2px solid #fff;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: opacity 0.3s;
        }
        .card-back i { color: rgba(255,255,255,0.3); font-size: 3rem; }
        .card.revealed .card-back { opacity: 0; pointer-events: none; }
        
        .win-glow { animation: glow 1.5s infinite alternate; }
        @keyframes glow {
            from { box-shadow: 0 0 10px rgba(245,158,11,0.5); }
            to { box-shadow: 0 0 30px rgba(245,158,11,1); }
        }
        /* ... (CSS ที่เหลือ) ... */
    </style>
</head>
<body>
    <!-- ... (โครงสร้าง HTML) ... -->
    <div class="table-container">
        <!-- ... (Dealer stage) ... -->
        
        <div class="announcement-banner" id="announcement-banner"></div>

        <!-- ... (Admin panel) ... -->
        
        <div class="cards-display">
            <div class="side-box" id="player-side-box">
                <div class="side-title player-title">PLAYER</div>
                <div class="score-badge" id="player-score">0</div>
                <div class="cards-row" id="player-cards"></div>
            </div>
            <div class="side-box" id="banker-side-box">
                <div class="side-title banker-title">BANKER</div>
                <div class="score-badge" id="banker-score">0</div>
                <div class="cards-row" id="banker-cards"></div>
            </div>
        </div>
        <!-- ... (ส่วนที่เหลือ) ... -->
    </div>

    <script src="/socket.io/socket.io.js"></script>

    <script>
        // ... (Audio Engine และ Game state) ...
        
        // เปลี่ยนตัวแปร matchHistory ให้ดึงจาก server แทน
        let serverHistory = []; 

        function initScoreboard() {
            const grid = document.getElementById('board-grid');
            grid.innerHTML = '';
            for (let i = 0; i < 20; i++) {
                const cell = document.createElement('div');
                cell.className = 'board-cell'; cell.id = `cell-${i}`;
                grid.appendChild(cell);
            }
            document.getElementById('round-count').innerText = serverHistory.length;
        }

        function drawScoreboard() {
            initScoreboard();
            serverHistory.forEach((result, index) => {
                const cell = document.getElementById(`cell-${index}`);
                if (cell) {
                    if (result === 'player') { cell.classList.add('p-win'); cell.innerText = 'P'; }
                    if (result === 'banker') { cell.classList.add('b-win'); cell.innerText = 'B'; }
                    if (result === 'tie') { cell.classList.add('t-win'); cell.innerText = 'T'; }
                }
            });
        }

        // ... (ฟังก์ชันอื่นๆ) ...

        async function startDealing(serverResult) {
            gameState = 'DEALING';
            document.getElementById('betting-grid').classList.add('disabled');
            document.getElementById('chip-selection').classList.add('disabled');
            document.getElementById('clear-btn').disabled = true;
            document.getElementById('timer-display').innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i>`;
            
            // ล้างไพ่เก่า
            document.getElementById('player-cards').innerHTML = '';
            document.getElementById('banker-cards').innerHTML = '';
            setScoreBadge('player-score', 0);
            setScoreBadge('banker-score', 0);
            document.getElementById('announcement-banner').style.display = 'none';
            document.getElementById('player-score').classList.remove('pokk');
            document.getElementById('banker-score').classList.remove('pokk');
            document.getElementById('player-side-box').classList.remove('win-glow');
            document.getElementById('banker-side-box').classList.remove('win-glow');

            dealerEl().classList.add('shuffling'); playShuffleSound();
            await sleep(700); dealerEl().classList.remove('shuffling');

            let playerHand = serverResult.pHand;
            let bankerHand = serverResult.bHand;

            const sequence = [
                { side: 'left', hand: playerHand, idx: 0, scoreId: 'player-score' },
                { side: 'right', hand: bankerHand, idx: 0, scoreId: 'banker-score' },
                { side: 'left', hand: playerHand, idx: 1, scoreId: 'player-score' },
                { side: 'right', hand: bankerHand, idx: 1, scoreId: 'banker-score' },
            ];

            for (const step of sequence) {
                await animateDealToSide(step.side);
                const target = step.side === 'left' ? 'player-cards' : 'banker-cards';
                const cardDiv = document.createElement('div');
                cardDiv.className = 'card'; 
                cardDiv.innerHTML = `<div class="card-back"><i class="fa-solid fa-diamond"></i></div>`;
                document.getElementById(target).appendChild(cardDiv);
                
                await sleep(400);
                cardDiv.classList.add('revealed');
                cardDiv.classList.add(step.hand[step.idx].isRed ? 'red' : 'black');
                cardDiv.innerHTML = `
                    <div class="top-val">${step.hand[step.idx].value}</div>
                    <div class="suit-center">${step.hand[step.idx].suit}</div>
                    <div class="bottom-val">${step.hand[step.idx].value}</div>
                `;
                setScoreBadge(step.scoreId, calculateScore(step.hand.slice(0, step.idx + 1)));
                await sleep(200);
            }

            let pScore = calculateScore(playerHand.slice(0, 2));
            let bScore = calculateScore(bankerHand.slice(0, 2));
            setScoreBadge('player-score', pScore); setScoreBadge('banker-score', bScore);
            await sleep(400); await sleep(1600);

            if (playerHand.length > 2) {
                await animateDealToSide('left');
                const cardDiv = document.createElement('div');
                cardDiv.className = 'card'; 
                cardDiv.innerHTML = `<div class="card-back"><i class="fa-solid fa-diamond"></i></div>`;
                document.getElementById('player-cards').appendChild(cardDiv);
                await sleep(400);
                cardDiv.classList.add('revealed');
                cardDiv.classList.add(playerHand[2].isRed ? 'red' : 'black');
                cardDiv.innerHTML = `
                    <div class="top-val">${playerHand[2].value}</div>
                    <div class="suit-center">${playerHand[2].suit}</div>
                    <div class="bottom-val">${playerHand[2].value}</div>
                `;
                pScore = calculateScore(playerHand);
                setScoreBadge('player-score', pScore);
                await sleep(1400);
            }

            if (bankerHand.length > 2) {
                await sleep(400);
                await animateDealToSide('right');
                const cardDiv = document.createElement('div');
                cardDiv.className = 'card'; 
                cardDiv.innerHTML = `<div class="card-back"><i class="fa-solid fa-diamond"></i></div>`;
                document.getElementById('banker-cards').appendChild(cardDiv);
                await sleep(400);
                cardDiv.classList.add('revealed');
                cardDiv.classList.add(bankerHand[2].isRed ? 'red' : 'black');
                cardDiv.innerHTML = `
                    <div class="top-val">${bankerHand[2].value}</div>
                    <div class="suit-center">${bankerHand[2].suit}</div>
                    <div class="bottom-val">${bankerHand[2].value}</div>
                `;
                bScore = calculateScore(bankerHand);
                setScoreBadge('banker-score', bScore);
                await sleep(1400);
            }

            let winner = serverResult.winner;
            let totalPlacedBets = bets.player + bets.banker + bets.tie; let winAmount = 0;
            if (winner === 'player') winAmount = bets.player * 2;
            else if (winner === 'banker') winAmount = bets.banker * 1.95;
            else winAmount = (bets.tie * 9) + bets.player + bets.banker;

            let netProfit = Math.floor(winAmount) - totalPlacedBets;
            balance += Math.floor(winAmount); updateUI();

            const banner = document.getElementById('announcement-banner');
            let winnerLabel = winner === 'tie' ? 'เสมอ (TIE)' : `${winner.toUpperCase()} ชนะ`;
            let profitText = netProfit >= 0 ? `<span style="color:#4ade80;">+${netProfit.toLocaleString()} THB</span>` : `<span style="color:#f87171;">${netProfit.toLocaleString()} THB</span>`;
            
            banner.innerHTML = `${winnerLabel} (${pScore} - ${bScore}) | ผลลัพธ์: ${profitText}`;
            banner.style.display = 'block';
            
            if (winner === 'player') {
                banner.style.borderColor = 'var(--player-blue)';
                document.getElementById('player-side-box').classList.add('win-glow');
            } else if (winner === 'banker') {
                banner.style.borderColor = 'var(--banker-red)';
                document.getElementById('banker-side-box').classList.add('win-glow');
            } else {
                banner.style.borderColor = 'var(--tie-green)';
                document.getElementById('player-side-box').classList.add('win-glow');
                document.getElementById('banker-side-box').classList.add('win-glow');
            }

            await sleep(3500); 
            bets = { player: 0, banker: 0, tie: 0 }; updateUI();
        }

        /* ====================================================
           การเชื่อมต่อ Socket แบบใหม่ (ซิงค์ทุกอย่างจาก Server)
           ==================================================== */
        const socket = io({ transports: ['websocket'] });

        socket.on('stateSync', (state) => {
            // อัปเดตเวลา
            document.getElementById('timer-display').innerHTML = `<i class="fa-solid fa-clock"></i> ${state.countdown}`;
            gameState = state.gameState;

            // อัปเดตสถิติจาก Server
            if (state.history) {
                serverHistory = state.history;
                drawScoreboard();
            }
            
            if (gameState === 'BETTING') {
                // ถ้าเริ่มรอบใหม่ ให้ล้างไพ่
                document.getElementById('player-cards').innerHTML = '';
                document.getElementById('banker-cards').innerHTML = '';
                setScoreBadge('player-score', 0);
                setScoreBadge('banker-score', 0);
                document.getElementById('announcement-banner').style.display = 'none';
                document.getElementById('player-score').classList.remove('pokk');
                document.getElementById('banker-score').classList.remove('pokk');
                document.getElementById('player-side-box').classList.remove('win-glow');
                document.getElementById('banker-side-box').classList.remove('win-glow');

                document.getElementById('betting-grid').classList.remove('disabled');
                document.getElementById('chip-selection').classList.remove('disabled');
                document.getElementById('clear-btn').disabled = false;
            } else {
                document.getElementById('betting-grid').classList.add('disabled');
                document.getElementById('chip-selection').classList.add('disabled');
                document.getElementById('clear-btn').disabled = true;
            }
        });

        // รับคำสั่งรีเซ็ตกระดานจาก Server
        socket.on('resetScoreboard', () => {
            serverHistory = [];
            drawScoreboard();
        });

        // รับไพ่จาก Server
        socket.on('startDealing', (serverResult) => {
            startDealing(serverResult);
        });

        // แอดมินเปลี่ยนโหมด
        const originalUpdateWinMode = updateWinMode;
        updateWinMode = function() {
            if (!isAdmin) return;
            adminWinMode = document.getElementById('admin-win-mode').value;
            socket.emit('adminAction', { type: 'SET_WIN_MODE', mode: adminWinMode });
        };

        updateUI();
        initScoreboard();
        renderCodeList();
    </script>
</body>
</html>
